<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Despesas - Projeto Resgate</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<style>
:root{
  --primary:#2563eb;--primary-dark:#1e40af;--bg:#f1f5f9;--card:#fff;--border:#e2e8f0;
  --text:#1e293b;--text-light:#64748b;--success:#10b981;--warning:#f59e0b;
  --danger:#ef4444;--fixed:#3b82f6;--variable:#8b5cf6;--reimb:#f59e0b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
header{background:var(--primary);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:0 2px 4px rgba(0,0,0,.1)}
header h1{font-size:16px;font-weight:600;white-space:nowrap}
.header-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.month-sel{display:flex;align-items:center;gap:6px}
.month-sel button{background:rgba(255,255,255,.2);border:none;color:#fff;width:28px;height:28px;border-radius:5px;cursor:pointer;font-size:13px;font-weight:600}
.month-sel button:hover{background:rgba(255,255,255,.35)}
.month-sel select{padding:5px 10px;border-radius:5px;border:none;font-size:13px;font-weight:500;background:rgba(255,255,255,.2);color:#fff;cursor:pointer;font-family:inherit}
.month-sel select option{color:var(--text);background:#fff}
.file-mgmt{display:flex;gap:6px;align-items:center;font-size:12px}
.file-mgmt button{background:rgba(255,255,255,.2);border:none;color:#fff;padding:5px 10px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:500;font-family:inherit}
.file-mgmt button:hover{background:rgba(255,255,255,.35)}
.file-status{background:rgba(0,0,0,.2);padding:4px 10px;border-radius:5px;font-size:11px;white-space:nowrap}
.file-status.dirty{background:#f59e0b;color:#fff}
nav{background:var(--card);border-bottom:1px solid var(--border);display:flex;padding:0 20px;overflow-x:auto}
nav button{padding:12px 18px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:500;color:var(--text-light);border-bottom:2px solid transparent;transition:.15s;white-space:nowrap;font-family:inherit}
nav button:hover{color:var(--text)}
nav button.active{color:var(--primary);border-bottom-color:var(--primary)}
main{padding:20px;max-width:1400px;margin:0 auto}
.view{display:none}.view.active{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--card);padding:16px;border-radius:10px;border:1px solid var(--border)}
.card .label{font-size:10px;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;font-weight:600}
.card .value{font-size:20px;font-weight:700}
.card.fixed .value{color:var(--fixed)}.card.variable .value{color:var(--variable)}
.card.reimb .value{color:var(--reimb)}.card.total .value{color:var(--text)}.card.pending .value{color:var(--danger)}
.panel{background:var(--card);border-radius:10px;border:1px solid var(--border);margin-bottom:16px;overflow:hidden}
.panel-header{padding:12px 18px;background:#f8fafc;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.panel-header h2{font-size:14px;font-weight:600}
.panel-header .actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{padding:7px 12px;border-radius:6px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:12px;font-weight:500;color:var(--text);transition:.15s;font-family:inherit;display:inline-flex;align-items:center;gap:4px}
.btn:hover{background:#f8fafc}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark)}
.btn-danger{color:var(--danger);border-color:#fecaca}
.btn-danger:hover{background:#fef2f2}
.btn-success{background:var(--success);color:#fff;border-color:var(--success)}
.btn-sm{padding:4px 8px;font-size:11px}
.btn-copy{padding:2px 6px;font-size:11px;background:#e2e8f0;border:none;border-radius:4px;cursor:pointer;color:#475569;margin-left:6px;vertical-align:middle}
.btn-copy:hover{background:#cbd5e1;color:#1e293b}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:12px;vertical-align:middle}
th{background:#f8fafc;font-weight:600;color:var(--text-light);font-size:10px;text-transform:uppercase;letter-spacing:.3px}
tr:hover td{background:#f8fafc}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.actions{text-align:right;white-space:nowrap}
.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600}
.badge.fixed{background:#dbeafe;color:#1e40af}
.badge.variable{background:#ede9fe;color:#6d28d9}
.badge.reimbursement{background:#fef3c7;color:#92400e}
.badge.paid{background:#d1fae5;color:#065f46}
.badge.pending{background:#fee2e2;color:#991b1b}
.tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;background:#f1f5f9;color:var(--text-light);font-weight:500}
.empty{padding:32px;text-align:center;color:var(--text-light);font-size:13px}
.filters{padding:12px 18px;background:#f8fafc;border-bottom:1px solid var(--border);display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;align-items:end}
.filters label{font-size:10px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:3px}
.filters select,.filters input{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:5px;font-size:12px;font-family:inherit;background:#fff}
.filters select:focus,.filters input:focus{outline:none;border-color:var(--primary)}
.multi-select { position: relative; user-select: none; cursor: pointer; width: 100%; }
.ms-btn { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 5px; font-size: 12px; font-family: inherit; background: #fff; text-align: left; display: flex; justify-content: space-between; align-items: center; }
.ms-btn:focus { outline: none; border-color: var(--primary); }
.ms-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid var(--border); border-radius: 5px; box-shadow: 0 4px 6px -1px rgba(0,0,0,.1); z-index: 100; max-height: 200px; overflow-y: auto; margin-top: 4px; display: none; padding: 4px; }
.ms-dropdown.show { display: block; }
.ms-item { display: flex; align-items: center; gap: 6px; padding: 6px 8px; font-size: 12px; border-radius: 4px; cursor: pointer; }
.ms-item:hover { background: #f8fafc; }
.ms-item input { cursor: pointer; margin: 0; }
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:10px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto}
.modal-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:15px;font-weight:600}
.modal-header .close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-light);line-height:1}
.modal-body{padding:18px}
.modal-footer{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:6px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:10px;font-weight:600;color:var(--text-light);margin-bottom:3px;text-transform:uppercase;letter-spacing:.3px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;background:#fff}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.form-group textarea{resize:vertical;min-height:50px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.reimb-group{border-bottom:1px solid var(--border);padding:12px 18px}
.reimb-group:last-child{border-bottom:none}
.reimb-group .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.reimb-group h4{font-size:13px;font-weight:600}
.reimb-group .total{color:var(--reimb);font-weight:700;font-size:13px}
.reimb-item{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12px;border-bottom:1px dashed var(--border)}
.reimb-item:last-child{border-bottom:none}
.reimb-item .info{flex:1;color:var(--text-light);font-size:11px}
.reimb-item .amt{font-weight:600;margin:0 10px;white-space:nowrap}
.annual-table{font-size:12px}
.annual-table th,.annual-table td{padding:7px 9px;white-space:nowrap}
.annual-table td.mname{font-weight:600;position:sticky;left:0;background:#fff}
.annual-table tfoot td{font-weight:700;background:#f8fafc}
.annual-scroll{overflow-x:auto}
.toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;z-index:2000;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none;max-width:340px}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:var(--success)}.toast.error{background:var(--danger)}
.hint{font-size:11px;color:var(--text-light);margin-top:4px}
.summary-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
.summary-row strong{font-weight:700}
.benef-group{border-bottom:1px solid var(--border)}
.benef-group:last-child{border-bottom:none}
.benef-head{padding:12px 18px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr;gap:10px;align-items:center;cursor:pointer;transition:.15s}
.benef-head:hover{background:#f8fafc}
.benef-head .name{font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px}
.benef-head .metric{font-size:12px;color:var(--text-light);text-align:right}
.benef-head .metric strong{color:var(--text);display:block;font-size:13px}
.benef-head .metric.pending strong{color:var(--danger)}
.benef-detail{background:#f8fafc;padding:0 18px 12px}
.benef-detail table{background:#fff;border-radius:6px;overflow:hidden}
.benef-detail table th{background:#f1f5f9}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:220px;padding-top:20px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:30px}
.bar-inner{width:100%;max-width:40px;background:linear-gradient(to top,var(--primary),#60a5fa);border-radius:3px 3px 0 0;transition:.2s}
.bar:hover .bar-inner{background:linear-gradient(to top,var(--primary-dark),var(--primary))}
.bar-value{font-size:10px;color:var(--text-light);font-weight:600;height:12px}
.bar-label{font-size:10px;color:var(--text-light);white-space:nowrap}
.data-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.data-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:16px;position:relative}
.data-card h3{font-size:14px;font-weight:600;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.data-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px}
.data-row .lbl{color:var(--text-light);font-weight:500;font-size:11px;text-transform:uppercase}
.data-row .val{font-weight:600;display:flex;align-items:center}
.actions-corner{position:absolute;top:12px;right:12px;display:flex;gap:6px}
.note-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:16px;position:relative;display:flex;flex-direction:column;gap:8px;}
.note-card h3{font-size:14px;font-weight:600;color:var(--primary)}
.note-card .content-box{background:#f8fafc;border:1px solid var(--border);border-radius:6px;padding:10px;font-family:monospace;font-size:13px;word-break:break-all;white-space:pre-wrap;flex:1;max-height:150px;overflow-y:auto;}
.note-card .footer-actions{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
@media (max-width:768px){
  main{padding:12px}
  .form-row,.form-row-3{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr 1fr}
  header{padding:10px}
  .benef-head{grid-template-columns:1fr;gap:4px}
  .benef-head .metric{text-align:left}
  .filters{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<header>
  <h1>📊 Projeto Resgate</h1>

      <button onclick="newFile()" title="Começar um novo arquivo">🆕 Novo</button>
    </div>
    <div class="month-sel">
      <button onclick="changeMonth(-1)" title="Mês anterior">◀</button>
      <select id="monthSelect" onchange="jumpToMonth(this.value)"></select>
      <button onclick="changeMonth(1)" title="Próximo mês">▶</button>

/* ============ HELPERS ============ */
function esc(s){
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtBRL(n){
  return 'R$ ' + Number(n||0).toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 });
}
function fmtDate(s){
  if (!s) return '—';
  const [y,m,d] = s.split('-');
  return `${d}/${m}`;
}
function fmtDateFull(s){
  if (!s) return '—';
  const [y,m,d] = s.split('-');
  return `${d}/${m}/${y}`;
}
function monthKey(y,m){ return `${y}-${String(m).padStart(2,'0')}`; }
function monthLabel(key){
  const [y,m] = key.split('-');
  return `${MONTH_NAMES[Number(m)-1]}/${y}`;
}
function monthLabelShort(key){
  const [y,m] = key.split('-');
  return MONTH_NAMES[Number(m)-1].slice(0,3) + '/' + y.slice(2);
}
function prevMonthKey(key){
  const [y,m] = key.split('-').map(Number);
  const d = new Date(y, m-2, 1);
  return monthKey(d.getFullYear(), d.getMonth()+1);
}
function nextMonthKey(key){
  const [y,m] = key.split('-').map(Number);
  const d = new Date(y, m, 1);
  return monthKey(d.getFullYear(), d.getMonth()+1);
}
function getMonth(key){
  if (!state.months[key]) state.months[key] = { transactions: [], populated: false, notes: [] };
  const m = state.months[key];
  if (!m.notes) m.notes = []; // Garante compatibilidade
  
  if (!m.populated && state.templates.length > 0) {
    m.transactions = state.templates.filter(t => t.active !== false).map(t => ({
      id: uid(),
      date: key + '-05',
      type: 'fixed',
      category: t.category,
      description: t.description,
      amount: Number(t.defaultAmount)||0,
      beneficiary: t.beneficiary || '',
      paymentMethod: t.paymentMethod || '—',
      status: 'pending',
      notes: 'Gerado a partir do modelo'
    }));
    m.populated = true;
    saveDraft();
    toast('Mês criado com as despesas fixas do modelo', 'success');
  }
  return m;
}
function getTotals(key){
  const m = state.months[key];
  if (!m) return { fixed:0, variable:0, reimbursement:0, total:0, pending:0, paid:0 };
  let fixed=0, variable=0, reimbursement=0, pending=0, paid=0;
  for (const t of m.transactions){
    const v = Number(t.amount)||0;
    if (t.type === 'fixed') fixed += v;
    else if (t.type === 'variable') variable += v;
    else if (t.type === 'reimbursement'){ variable += v; reimbursement += v; }
    if (t.status === 'pending') pending += v;
    else paid += v;
  }
  return { fixed, variable, reimbursement, total: fixed + variable, pending, paid };
}
function allMonthKeys(){
  const keys = new Set(Object.keys(state.months));
  const now = new Date();
  for (let i = -6; i <= 12; i++) {
    const d = new Date(now.getFullYear(), now.getMonth()+i, 1);
    keys.add(monthKey(d.getFullYear(), d.getMonth()+1));
  }
  return Array.from(keys).sort();
}

/* ============ PERSISTÊNCIA ============ */
function loadDraft(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){ console.warn('Falha ao carregar rascunho', e); }
  return null;
}
function saveDraft(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); markDirty(); }
  catch(e){ toast('Erro ao salvar rascunho', 'error'); }
}
function markDirty(){ hasUnsavedFileChanges = true; updateFileStatus(); }
function updateFileStatus(){
  const el = document.getElementById('fileStatus');
  if (!el) return;
  if (hasUnsavedFileChanges) {
    el.className = 'file-status dirty';
    el.textContent = lastFileSave ? '⚠️ Alterações não salvas' : '📄 Rascunho (não salvo em arquivo)';
    el.title = fileName ? 'Arquivo: ' + fileName : 'Nenhum arquivo aberto';
  } else {
    el.className = 'file-status';
    el.textContent = fileName ? '✅ ' + fileName : '📄 Rascunho';
    el.title = lastFileSave ? 'Salvo em ' + lastFileSave.toLocaleTimeString('pt-BR') : '';
  }
}

async function saveToFile(){
  try {
    if ('showSaveFilePicker' in window) {
      if (!fileHandle) {
        fileHandle = await window.showSaveFilePicker({
          suggestedName: 'projeto-resgate.json',
          types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
        });
        fileName = fileHandle.name;
      }
      const writable = await fileHandle.createWritable();
      await writable.write(JSON.stringify(state, null, 2));
      await writable.close();
      lastFileSave = new Date();
      hasUnsavedFileChanges = false;
      updateFileStatus();
      toast('Salvo em ' + fileName, 'success');
    } else {
      const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'projeto-resgate-' + new Date().toISOString().slice(0,10) + '.json';
      a.click();
      URL.revokeObjectURL(url);
      lastFileSave = new Date();
      hasUnsavedFileChanges = false;
      updateFileStatus();
      toast('Arquivo baixado', 'success');
    }
  } catch(e){ if (e.name !== 'AbortError') toast('Erro ao salvar: ' + e.message, 'error'); }
}

async function openFromFile(){
  try {
    if ('showOpenFilePicker' in window) {
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
      });
      fileHandle = handle;
      fileName = handle.name;
      const file = await handle.getFile();
      const text = await file.text();
      loadFromText(text);
    } else {
      document.getElementById('fileInputFallback').click();
    }
  } catch(e){ if (e.name !== 'AbortError') toast('Erro ao abrir: ' + e.message, 'error'); }
}

function handleFallbackFileLoad(ev){
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => loadFromText(e.target.result);
  reader.readAsText(file);
  ev.target.value = '';
}

function loadFromText(text){
  try {
    const data = JSON.parse(text);
    if (!data.months) throw new Error('Formato inválido: falta "months"');
    state = data;
    if (!state.currentMonth) state.currentMonth = '2026-11';
    if (!state.templates) state.templates = [];
    if (!state.contacts) state.contacts = getDefaultContacts();
    if (!state.services) state.services = getDefaultServices();
    // Garantir notes e migrar nome do Marco
    for (const k in state.months) {
      if (!state.months[k].notes) state.months[k].notes = [];
      for (const tx of state.months[k].transactions) {
        if (tx.beneficiary === 'Marco (MEI)') tx.beneficiary = 'Marco Túlio';
      }
    }
    // Migrar nomes nos templates
    for (const t of state.templates) {
      if (t.beneficiary === 'Marco (MEI)') t.beneficiary = 'Marco Túlio';
    }
    // Migrar nomes nos contatos
    for (const c of state.contacts) {
      if (c.name === 'Marco (MEI) / M. Túlio' || c.name === 'Marco (MEI)') c.name = 'Marco Túlio';
    }
    
    lastFileSave = new Date();
    hasUnsavedFileChanges = false;
    saveDraft();
    renderMonthSelect();
    updateFileStatus();
    showView('dashboard');
    toast('Arquivo carregado', 'success');
  } catch(e){ toast('Arquivo inválido: ' + e.message, 'error'); }
}

function newFile(){
  if (!confirm('Começar um novo arquivo? Os dados atuais serão substituídos pela planilha original importada.')) return;
  state = buildSeed();
  fileHandle = null;
  fileName = null;
  lastFileSave = null;
  hasUnsavedFileChanges = true;
  saveDraft();
  renderMonthSelect();
  updateFileStatus();
  showView('dashboard');
  toast('Novo arquivo criado', 'success');
}

}
function jumpToMonth(key){
  state.currentMonth = key;

function toggleFilter(key, val) {
  const arr = filterState[key];
  const idx = arr.indexOf(val);
  if (idx >= 0) arr.splice(idx, 1);
  else arr.push(val);
  renderLancamentos();
}

function parseFilterDate(val) {
    if (!val) return '';
    if (val.includes('-')) return val;
    const [year, month] = state.currentMonth.split('-');
    const parts = val.split('/');
    if (parts.length === 1) {
        const d = parts[0].trim().padStart(2, '0');
        return `${year}-${month}-${d}`;
    }
    if (parts.length === 2) {
        const d = parts[0].trim().padStart(2, '0');
        const m = parts[1].trim().padStart(2, '0');
        return `${year}-${m}-${d}`;
    }
    return '';
}

function getFilteredTransactions(key) {
  const m = state.months[key];
  if (!m) return [];
  const from = parseFilterDate(filterState.dateFrom);
  const to = parseFilterDate(filterState.dateTo);

  return m.transactions.filter(t => {
    if (filterState.type.length > 0 && !filterState.type.includes(t.type)) return false;
    if (filterState.category.length > 0 && !filterState.category.includes(t.category)) return false;
    if (filterState.status && t.status !== filterState.status) return false;
    if (filterState.beneficiary.length > 0 && !filterState.beneficiary.includes(t.beneficiary)) return false;
    if (from && t.date < from) return false;
    if (to && t.date > to) return false;
    if (filterState.search) {
      const q = filterState.search.toLowerCase();
      const hay = (t.description + ' ' + (t.beneficiary||'') + ' ' + (t.notes||'')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

/* ============ BENEFICIÁRIOS ============ */
let benefSearch = '';
let benefExpanded = {};
function renderBeneficiarios(){
  const byBenef = {};
  for (const [monthKey, m] of Object.entries(state.months)){
    for (const t of m.transactions){
      const b = t.beneficiary || '— sem beneficiário —';
      if (!byBenef[b]) byBenef[b] = { name: b, total:0, fixed:0, variable:0, reimbursement:0, pending:0, paid:0, count:0, items: [] };
      const v = Number(t.amount)||0;
      byBenef[b].total += v;
      byBenef[b][t.type] += v;
      byBenef[b].count++;
      if (t.status === 'pending') byBenef[b].pending += v;
      else byBenef[b].paid += v;
      byBenef[b].items.push({ ...t, sourceMonth: monthKey });
    }
  }
  let list = Object.values(byBenef).sort((a,b) => b.total - a.total);
  if (benefSearch){
    const q = benefSearch.toLowerCase();
    list = list.filter(b => b.name.toLowerCase().includes(q));
  }
  const grandTotal = list.reduce((s,b) => s + b.total, 0);
  const grandPending = list.reduce((s,b) => s + b.pending, 0);
  const grandReimb = list.reduce((s,b) => s + b.reimbursement, 0);

  const html = `
    <div class="cards">
      <div class="card total"><div class="label">Total movimentado</div><div class="value">${fmtBRL(grandTotal)}</div></div>
      <div class="card reimb"><div class="label">Reembolsos</div><div class="value">${fmtBRL(grandReimb)}</div></div>
      <div class="card pending"><div class="label">Pendente</div><div class="value">${fmtBRL(grandPending)}</div></div>
      <div class="card"><div class="label">Beneficiários</div><div class="value">${list.length}</div></div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2>Detalhamento por beneficiário</h2>
        <div class="actions">
          <input placeholder="Buscar pessoa..." value="${esc(benefSearch)}" oninput="benefSearch=this.value;renderBeneficiarios()" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit">
        </div>
      </div>
      ${list.length === 0 ? '<div class="empty">Nenhum beneficiário encontrado.</div>' : list.map(b => {
        const contact = state.contacts.find(x => x.name === b.name);
        let pixHTML = '';
        if (contact && contact.bank) {
          const safeBank = contact.bank.replace(/'/g, "\\'").replace(/"/g, '\\"');
          pixHTML = `<div class="hint" style="margin-top:4px; font-weight:normal; color:var(--text-light); font-size:11px; display:flex; align-items:center; gap:4px;">PIX: ${esc(contact.bank)} <button class="btn-copy" onclick="event.stopPropagation(); copyText('${safeBank}')">📋</button></div>`;
        } else if (contact && contact.doc) {
          pixHTML = `<div class="hint" style="margin-top:4px; font-weight:normal; color:var(--text-light); font-size:11px;">Doc: ${esc(contact.doc)}</div>`;
        }
        
        return `
        <div class="benef-group">
          <div class="benef-head" onclick="toggleBenef('${esc(b.name).replace(/'/g,'&#39;')}')">
            <div class="name">
              <div>${esc(b.name)} <span class="tag">${b.count} lançamentos</span></div>
              ${pixHTML}
            </div>
            <div class="metric">Total<strong>${fmtBRL(b.total)}</strong></div>
            <div class="metric">Fixas<strong>${fmtBRL(b.fixed)}</strong></div>
            <div class="metric">Variáveis<strong>${fmtBRL(b.variable - b.reimbursement)}</strong></div>
            <div class="metric">Reembolsos<strong>${fmtBRL(b.reimbursement)}</strong></div>
            <div class="metric pending">Pendente<strong>${fmtBRL(b.pending)}</strong></div>
          </div>
          ${benefExpanded[b.name] ? `
            <div class="benef-detail">
              <table>
                <thead><tr><th>Mês</th><th>Data</th><th>Tipo</th><th>Categoria</th><th>Descrição</th><th>Status</th><th class="num">Valor</th></tr></thead>
                <tbody>
                  ${b.items.sort((a,b) => (a.date||'').localeCompare(b.date||'')).map(t => `
                    <tr>
                      <td>${monthLabelShort(t.sourceMonth)}</td>
                      <td>${fmtDate(t.date)}</td>
                      <td><span class="badge ${t.type}">${t.type === 'fixed' ? 'Fixa' : t.type === 'variable' ? 'Variável' : 'Reembolso'}</span></td>
                      <td>${esc(t.category)}</td>
                      <td>${esc(t.description)}${t.notes ? ' <em>(' + esc(t.notes) + ')</em>' : ''}</td>
                      <td><span class="badge ${t.status}">${STATUS_LABELS[t.status]}</span></td>
                      <td class="num">${fmtBRL(t.amount)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          ` : ''}
        </div>
        `;
      }).join('')}
    </div>
  `;
  document.getElementById('view-beneficiarios').innerHTML = html;
}

function suggestFromCurrent(){
  const m = state.months[state.currentMonth];
  if (!m){ toast('Mês sem dados', 'error'); return; }
  const existing = new Set(state.templates.map(t => t.description));
  let added = 0;
  m.transactions.filter(t => t.type === 'fixed').forEach(t => {
    if (!existing.has(t.description)){
      state.templates.push({ id: uid(), description: t.description, category: t.category, defaultAmount: t.amount, beneficiary: t.beneficiary, paymentMethod: t.paymentMethod, active: true });
      added++;
    }
  });
  saveDraft(); toast(added + ' modelo(s) importado(s)', 'success'); renderFixas();
}

function copyText(text) {
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => {
    toast('Copiado!', 'success');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('Copiado!', 'success');
  });
}

/* ============ REEMBOLSOS ============ */
function renderReembolsos(){
  const groups = {};
  for (const [key, m] of Object.entries(state.months)){
    for (const t of m.transactions){
      if (t.type !== 'reimbursement' || t.status !== 'pending') continue;
      const p = t.beneficiary || '— sem beneficiário —';
      groups[p] = groups[p] || { person: p, total: 0, items: [] };
      groups[p].total += Number(t.amount)||0;
      groups[p].items.push({ ...t, monthKey: key });
    }
  }
  const list = Object.values(groups).sort((a,b) => b.total - a.total);
  const grandTotal = list.reduce((s, g) => s + g.total, 0);

  const html = `
    <div class="cards">
      <div class="card reimb"><div class="label">Total a devolver</div><div class="value">${fmtBRL(grandTotal)}</div></div>
      <div class="card"><div class="label">Pessoas com pendência</div><div class="value">${list.length}</div></div>
      <div class="card"><div class="label">Lançamentos pendentes</div><div class="value">${list.reduce((s,g) => s + g.items.length, 0)}</div></div>
    </div>

    <div class="panel">
      <div class="panel-header"><h2>Reembolsos a devolver — agrupados por pessoa</h2></div>
      ${list.length === 0 ? '<div class="empty">Nenhum reembolso pendente. 🎉</div>' : list.map(g => `
        <div class="reimb-group">
          <div class="head">
            <h4>${esc(g.person)}</h4>
            <div class="total">${fmtBRL(g.total)}</div>
          </div>
          ${g.items.map(it => `
            <div class="reimb-item">
              <span class="info">${fmtDateFull(it.date)} · ${esc(it.description)} · ${monthLabelShort(it.monthKey)}</span>
              <span class="amt">${fmtBRL(it.amount)}</span>
              <button class="btn btn-sm btn-success" onclick="markPaid('${it.id}', '${it.monthKey}')">Marcar devolvido</button>
            </div>
          `).join('')}
        </div>
      `).join('')}
    </div>
  `;
  document.getElementById('view-reembolsos').innerHTML = html;
}
function markPaid(id, monthKeyArg){
  const key = monthKeyArg || state.currentMonth;
  let found = (state.months[key] && state.months[key].transactions.find(t => t.id === id));
  if (!found){
    for (const k of Object.keys(state.months)){
      found = state.months[k].transactions.find(t => t.id === id);
      if (found) break;
    }
  }
  if (found){
    found.status = 'paid';
    saveDraft();
    toast('Reembolso marcado como devolvido', 'success');
    const active = document.querySelector('nav button.active');
    renderView(active ? active.dataset.view : 'dashboard');
  }
}
function toggleStatus(id){
  const m = state.months[state.currentMonth];
  const t = m && m.transactions.find(x => x.id === id);
  if (t){ t.status = t.status === 'paid' ? 'pending' : 'paid'; saveDraft(); renderLancamentos(); toast('Status alterado', 'success'); }
}

/* ============ MODAL LANÇAMENTO ============ */
let editingTxId = null;
function openNewModal(type){
  editingTxId = null;
  const today = new Date();
  const dateStr = state.currentMonth + '-' + String(today.getDate()).padStart(2,'0');
  const tx = { type, date: dateStr,
    category: type === 'fixed' ? 'Colaboradores' : type === 'variable' ? 'Gás' : 'Férias',
    description: '', amount: 0, beneficiary: '', paymentMethod: 'PIX', status: 'pending', notes: '' };
  openTxModal(tx, false);
}
function openEditModal(id){
  const m = state.months[state.currentMonth];
  const t = m && m.transactions.find(x => x.id === id);
  if (!t) return;
  editingTxId = id;
  openTxModal(t, true);
}
function openTxModal(t, isEdit){
  const cats = t.type === 'fixed' ? FIXED_CATS : t.type === 'variable' ? VAR_CATS : REIMB_CATS;
  const statusLabels = t.type === 'reimbursement' ? REIMB_STATUS_LABELS : STATUS_LABELS;
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-header"><h3>${isEdit ? 'Editar' : 'Novo'} lançamento</h3><button class="close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group"><label>Tipo</label>
          <select id="txType" onchange="onTxTypeChange()">
            <option value="fixed" ${t.type==='fixed'?'selected':''}>Despesa Fixa</option>
            <option value="variable" ${t.type==='variable'?'selected':''}>Despesa Variável</option>
            <option value="reimbursement" ${t.type==='reimbursement'?'selected':''}>Reembolso a devolver</option>
          </select>
        </div>
        <div class="form-group"><label>Data</label><input id="txDate" type="date" value="${t.date}"></div>
      </div>
      <div class="form-group"><label>Descrição</label><input id="txDesc" value="${esc(t.description)}" placeholder="Ex.: Jurandir (1ª quinzena)"></div>
      <div class="form-row">
        <div class="form-group"><label>Categoria</label>
          <select id="txCat">${cats.map(c => `<option ${c===t.category?'selected':''}>${c}</option>`).join('')}</select>
        </div>
        <div class="form-group"><label>Valor (R$)</label><input id="txAmt" type="number" step="0.01" value="${t.amount}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Beneficiário</label><input id="txBen" value="${esc(t.beneficiary) || ''}" placeholder="Ex.: Jurandir Silva"></div>
        <div class="form-group"><label>Forma de pagamento</label><select id="txPay">${PAY_METHODS.map(p => `<option ${p===t.paymentMethod?'selected':''}>${p}</option>`).join('')}</select></div>
      </div>
      <div class="form-group"><label>Status</label>
        <select id="txStatus">
          <option value="pending" ${t.status==='pending'?'selected':''}>${statusLabels.pending}</option>
          <option value="paid" ${t.status==='paid'?'selected':''}>${statusLabels.paid}</option>
        </select>
      </div>
      <div class="form-group"><label>Observações</label><textarea id="txNotes" placeholder="Opcional">${esc(t.notes) || ''}</textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveTx()">Salvar</button>
    </div>
  `;
  document.getElementById('modal').classList.add('show');
}
function onTxTypeChange(){
  const type = document.getElementById('txType').value;
  const cats = type === 'fixed' ? FIXED_CATS : type === 'variable' ? VAR_CATS : REIMB_CATS;
  const statusLabels = type === 'reimbursement' ? REIMB_STATUS_LABELS : STATUS_LABELS;
  document.getElementById('txCat').innerHTML = cats.map(c => `<option>${c}</option>`).join('');
  const stSel = document.getElementById('txStatus');
  const cur = stSel.value;
  stSel.innerHTML = `
    <option value="pending" ${cur==='pending'?'selected':''}>${statusLabels.pending}</option>
    <option value="paid" ${cur==='paid'?'selected':''}>${statusLabels.paid}</option>
  `;
}
function saveTx(){
  const type = document.getElementById('txType').value;
  const tx = {
    id: editingTxId || uid(),
    type,
    date: document.getElementById('txDate').value,
    description: document.getElementById('txDesc').value.trim(),
    category: document.getElementById('txCat').value,
    amount: Number(document.getElementById('txAmt').value)||0,
    beneficiary: document.getElementById('txBen').value.trim(),
    paymentMethod: document.getElementById('txPay').value,
    status: document.getElementById('txStatus').value,
    notes: document.getElementById('txNotes').value.trim()
  };
  if (!tx.description || !tx.date){ toast('Preencha descrição e data', 'error'); return; }
  const m = getMonth(state.currentMonth);
  if (editingTxId){
    const idx = m.transactions.findIndex(x => x.id === editingTxId);
    if (idx >= 0) m.transactions[idx] = tx;
  } else {
    m.transactions.push(tx);
  }
  m.transactions.sort((a,b) => (a.date||'').localeCompare(b.date||''));
  saveDraft(); closeModal();
  toast(editingTxId ? 'Atualizado' : 'Adicionado', 'success');
  editingTxId = null;
  renderLancamentos();
}
function removeTx(id){
  if (!confirm('Excluir este lançamento?')) return;
  const m = state.months[state.currentMonth];
  m.transactions = m.transactions.filter(t => t.id !== id);
  saveDraft(); renderLancamentos(); toast('Excluído', 'success');
}
function closeModal(){
  document.getElementById('modal').classList.remove('show');
  editingTxId = null;
}

/* ============ RELATÓRIO ANUAL ============ */
function renderRelatorios(){
  const year = state.currentMonth.split('-')[0];
  const months = [];
  for (let i=1; i<=12; i++) months.push(monthKey(Number(year), i));
  const rows = months.map(k => ({ key:k, ...getTotals(k) }));
  const totals = rows.reduce((acc, r) => ({
    fixed: acc.fixed + r.fixed, variable: acc.variable + r.variable,
    reimbursement: acc.reimbursement + r.reimbursement, total: acc.total + r.total, pending: acc.pending + r.pending
  }), { fixed:0, variable:0, reimbursement:0, total:0, pending:0 });

  const html = `
    <div class="panel">
      <div class="panel-header">
        <h2>Comparativo mensal — ${year}</h2>
        <div class="actions">
          <button class="btn btn-primary btn-sm" onclick="printAnnualReport()">🖨️ PDF Anual</button>
        </div>
      </div>
      <div class="annual-scroll">
        <table class="annual-table">
          <thead><tr><th>Mês</th><th class="num">Fixas</th><th class="num">Variáveis</th><th class="num">Reembolsos</th><th class="num">Total</th><th class="num">Pendente</th></tr></thead>
          <tbody>
            ${rows.map(r => `
              <tr>
                <td class="mname">${monthLabel(r.key)}</td>
                <td class="num">${fmtBRL(r.fixed)}</td>
                <td class="num">${fmtBRL(r.variable)}</td>
                <td class="num">${fmtBRL(r.reimbursement)}</td>
                <td class="num"><strong>${fmtBRL(r.total)}</strong></td>
                <td class="num" style="color:${r.pending>0?'var(--danger)':'inherit'}">${fmtBRL(r.pending)}</td>
              </tr>
            `).join('')}
          </tbody>
          <tfoot>
            <tr>
              <td>Total do ano</td>
              <td class="num">${fmtBRL(totals.fixed)}</td>
              <td class="num">${fmtBRL(totals.variable)}</td>
              <td class="num">${fmtBRL(totals.reimbursement)}</td>
              <td class="num">${fmtBRL(totals.total)}</td>
              <td class="num">${fmtBRL(totals.pending)}</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header"><h2>Evolução do total mensal</h2></div>
      <div style="padding:16px">${renderBarChart(rows)}</div>
    </div>
  `;
  document.getElementById('view-relatorios').innerHTML = html;
}
function renderBarChart(rows){
  const max = Math.max(...rows.map(r => r.total), 1);
  return `
    <div class="bar-chart">
      ${rows.map(r => {
        const h = Math.max(2, Math.round((r.total / max) * 180));
        return `<div class="bar" title="${monthLabel(r.key)}: ${fmtBRL(r.total)}">
          <div class="bar-value">${r.total > 0 ? 'R$' + Math.round(r.total/1000) + 'k' : ''}</div>
          <div class="bar-inner" style="height:${h}px"></div>
          <div class="bar-label">${monthLabelShort(r.key)}</div>
        </div>`;
      }).join('')}
    </div>
  `;
}

function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'projeto-resgate-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); URL.revokeObjectURL(url); toast('Backup baixado', 'success');
}
function resetData(){
  if (!confirm('Restaurar dados originais? Todos os dados atuais serão substituídos.')) return;
  state = buildSeed();
  fileHandle = null; fileName = null; lastFileSave = null;
  saveDraft(); renderMonthSelect(); updateFileStatus(); showView('dashboard');
  toast('Dados originais restaurados', 'success');
}

/* ============ GERAÇÃO DE PDF ============ */
function generateMonthlyReportHTML(monthKey, filteredTx = null){
  const m = state.months[monthKey] || { transactions: [] };
  const txList = filteredTx || m.transactions;

  const fixed = txList.filter(t => t.type === 'fixed');
  const variable = txList.filter(t => t.type === 'variable');
  const reimbursement = txList.filter(t => t.type === 'reimbursement');

  let fixedBase = 0, variableOnly = 0, reimbAll = 0, pendingAll = 0;
  for (const t of txList){
    const v = Number(t.amount||0);
    if (t.type === 'fixed') fixedBase += v;
    else if (t.type === 'variable') variableOnly += v;
    else if (t.type === 'reimbursement') reimbAll += v;
    if (t.status === 'pending') pendingAll += v;
  }
  const totalAll = fixedBase + variableOnly + reimbAll;

  const reimbByKey = {};
  for (const r of reimbursement){
    if (!r.beneficiary) continue;
    const k = r.beneficiary + '|' + r.date;
    if (!reimbByKey[k]) reimbByKey[k] = [];
    reimbByKey[k].push(r);
  }

  const combinedFixed = fixed.map(f => {
    if (!f.beneficiary){
      return { ...f, originalAmount: Number(f.amount||0), reimbAmount: 0, reimbItems: [], combinedAmount: Number(f.amount||0), displayStatus: f.status };
    }
    const k = f.beneficiary + '|' + f.date;
    const matching = reimbByKey[k] || [];
    const reimbAmt = matching.reduce((s, r) => s + Number(r.amount||0), 0);
    const allItems = [f, ...matching];
    const anyPending = allItems.some(it => it.status === 'pending');
    return {
      ...f,
      originalAmount: Number(f.amount||0),
      reimbAmount: reimbAmt,
      reimbItems: matching,
      combinedAmount: Number(f.amount||0) + reimbAmt,
      displayStatus: anyPending ? 'pending' : 'paid'
    };
  });

  const combinedIds = new Set();
  combinedFixed.forEach(f => f.reimbItems.forEach(r => combinedIds.add(r.id)));
  const uncombinedPending = reimbursement.filter(r => !combinedIds.has(r.id) && r.status === 'pending');
  const combinedReimbTotal = combinedFixed.reduce((s, f) => s + f.reimbAmount, 0);

  const fixedSectionTotal = combinedFixed.reduce((s, f) => s + f.combinedAmount, 0);
  const variableSectionTotal = variable.reduce((s, t) => s + Number(t.amount||0), 0);
  const uncombinedSectionTotal = uncombinedPending.reduce((s, t) => s + Number(t.amount||0), 0);

  const fixedRowsHTML = combinedFixed.map(f => {
    let breakdown = '';
    if (f.reimbAmount > 0){
      if (f.reimbItems.length === 1){
        breakdown = `<div style="font-size:8px;color:#64748b;margin-top:2px">Base ${fmtBRL(f.originalAmount)} + ${fmtBRL(f.reimbAmount)} reembolso = <strong>${fmtBRL(f.combinedAmount)}</strong></div>`;
      } else {
        breakdown = `<div style="font-size:8px;color:#64748b;margin-top:2px">Base ${fmtBRL(f.originalAmount)} + ${f.reimbItems.map(r => fmtBRL(r.amount)).join(' + ')} reembolsos = <strong>${fmtBRL(f.combinedAmount)}</strong></div>`;
      }
    }
    return `
      <tr>
        <td>${fmtDateFull(f.date)}</td>
        <td>${esc(f.category)}</td>
        <td>${esc(f.description)}${f.notes ? ' <em>(' + esc(f.notes) + ')</em>' : ''}${breakdown}</td>
        <td>${esc(f.beneficiary) || '—'}</td>
        <td>${esc(f.paymentMethod)}</td>
        <td><span class="badge ${f.displayStatus}">${STATUS_LABELS[f.displayStatus]}</span></td>
        <td class="num"><strong>${fmtBRL(f.combinedAmount)}</strong></td>
      </tr>
    `;
  }).join('');

  return `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Relatório Mensal — ${monthLabel(monthKey)}</title>
  <style>
    @page { margin: 1.2cm; }
    * { box-sizing: border-box; }
    body { font-family: Arial, Helvetica, sans-serif; font-size: 10px; color: #1e293b; margin: 0; padding: 0; }
    h1 { font-size: 18px; margin: 0 0 4px; color: #1e40af; }
    h2 { font-size: 12px; margin: 16px 0 6px; padding-bottom: 4px; border-bottom: 2px solid #2563eb; color: #1e40af; text-transform: uppercase; letter-spacing: .5px; }
    .header { border-bottom: 3px solid #2563eb; padding-bottom: 10px; margin-bottom: 14px; }
    .subtitle { color: #64748b; font-size: 10px; margin-top: 2px; }
    .meta { display: flex; justify-content: space-between; font-size: 9px; color: #64748b; margin-top: 6px; }
    .summary { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 8px; }
    .summary-card { border: 1px solid #e2e8f0; padding: 8px; border-radius: 4px; }
    .summary-card .label { font-size: 8px; text-transform: uppercase; color: #64748b; font-weight: bold; letter-spacing: .3px; }
    .summary-card .value { font-size: 13px; font-weight: bold; margin-top: 3px; color: #1e293b; }
    .summary-card.fixed .value { color: #1e40af; }
    .summary-card.variable .value { color: #6d28d9; }
    .summary-card.reimb .value { color: #b45309; }
    .summary-card.pending .value { color: #b91c1c; }
    .note { font-size: 9px; color: #64748b; font-style: italic; margin-bottom: 12px; padding: 6px 8px; background: #f8fafc; border-left: 3px solid #2563eb; }
    .alert { font-size: 9px; color: #92400e; font-style: italic; margin-bottom: 12px; padding: 6px 8px; background: #fef3c7; border-left: 3px solid #f59e0b; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
    th, td { border: 1px solid #cbd5e1; padding: 4px 6px; text-align: left; font-size: 9px; vertical-align: top; }
    th { background: #f1f5f9; font-weight: bold; color: #475569; text-transform: uppercase; font-size: 8px; letter-spacing: .3px; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .total-row { background: #f8fafc; font-weight: bold; }
    .badge { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 8px; font-weight: bold; }
    .badge.paid { background: #d1fae5; color: #065f46; }
    .badge.pending { background: #fee2e2; color: #991b1b; }
    .footer { margin-top: 20px; padding-top: 8px; border-top: 1px solid #cbd5e1; font-size: 8px; color: #94a3b8; text-align: center; }
    .no-print { text-align: center; margin-top: 20px; padding: 10px; }
    .no-print button { padding: 8px 16px; margin: 0 6px; font-size: 12px; cursor: pointer; border-radius: 5px; border: 1px solid #cbd5e1; background: #fff; font-family: inherit; }
    .no-print button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
    @media print { .no-print { display: none; } body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
  </style></head><body>
    <div class="header">
      <h1>Projeto Resgate — Relatório Mensal</h1>
      <div class="subtitle">${monthLabel(monthKey)}</div>
      <div class="meta"><span>Gerado em ${new Date().toLocaleString('pt-BR')}</span><span>${txList.length} lançamentos</span></div>
    </div>
    ${filteredTx ? `<div class="alert">⚠️ RELATÓRIO FILTRADO: exibindo apenas os ${txList.length} lançamentos que correspondem aos filtros aplicados na tela.</div>` : ''}
    <div class="summary">
      <div class="summary-card fixed"><div class="label">Fixas (base)</div><div class="value">${fmtBRL(fixedBase)}</div></div>
      <div class="summary-card variable"><div class="label">Variáveis</div><div class="value">${fmtBRL(variableOnly)}</div></div>
      <div class="summary-card reimb"><div class="label">Reembolsos</div><div class="value">${fmtBRL(reimbAll)}</div></div>
      <div class="summary-card"><div class="label">Total do Mês</div><div class="value">${fmtBRL(totalAll)}</div></div>
      <div class="summary-card pending"><div class="label">Pendente</div><div class="value">${fmtBRL(pendingAll)}</div></div>
    </div>
    ${combinedReimbTotal > 0 ? `<div class="note">💡 Reembolsos somados aos pagamentos fixos quando coincidem beneficiário e data (total combinado: ${fmtBRL(combinedReimbTotal)}). O valor exibido em cada linha já inclui o reembolso correspondente — o detalhamento aparece abaixo da descrição.</div>` : ''}

    <h2>Pagamentos Fixos + Reembolsos Combinados</h2>
    ${fixed.length === 0 ? '<p style="font-size:9px;color:#94a3b8">Nenhuma despesa fixa neste relatório.</p>' : `
      <table>
        <thead><tr><th>Data</th><th>Categoria</th><th>Descrição</th><th>Beneficiário</th><th>Pagamento</th><th>Status</th><th class="num">Valor</th></tr></thead>
        <tbody>
          ${fixedRowsHTML}
          <tr class="total-row"><td colspan="6">Subtotal fixos${combinedReimbTotal > 0 ? ' + reembolsos combinados' : ''}</td><td class="num">${fmtBRL(fixedSectionTotal)}</td></tr>
        </tbody>
      </table>
    `}

    ${variable.length > 0 ? `
      <h2>Despesas Variáveis</h2>
      <table>
        <thead><tr><th>Data</th><th>Categoria</th><th>Descrição</th><th>Beneficiário</th><th>Pagamento</th><th>Status</th><th class="num">Valor</th></tr></thead>
        <tbody>
          ${variable.map(t => `
            <tr>
              <td>${fmtDateFull(t.date)}</td>
              <td>${esc(t.category)}</td>
              <td>${esc(t.description)}${t.notes ? ' <em>(' + esc(t.notes) + ')</em>' : ''}</td>
              <td>${esc(t.beneficiary) || '—'}</td>
              <td>${esc(t.paymentMethod)}</td>
              <td><span class="badge ${t.status}">${STATUS_LABELS[t.status]}</span></td>
              <td class="num">${fmtBRL(t.amount)}</td>
            </tr>
          `).join('')}
          <tr class="total-row"><td colspan="6">Subtotal variáveis</td><td class="num">${fmtBRL(variableSectionTotal)}</td></tr>
        </tbody>
      </table>
    ` : ''}

    ${uncombinedPending.length > 0 ? `
      <h2>Reembolsos a Devolver (sem pagamento fixo associado)</h2>
      <table>
        <thead><tr><th>Data</th><th>Beneficiário</th><th>Motivo</th><th class="num">Valor</th></tr></thead>
        <tbody>
          ${uncombinedPending.map(t => `<tr><td>${fmtDateFull(t.date)}</td><td>${esc(t.beneficiary) || '—'}</td><td>${esc(t.description)}</td><td class="num">${fmtBRL(t.amount)}</td></tr>`).join('')}
          <tr class="total-row"><td colspan="3">Subtotal</td><td class="num">${fmtBRL(uncombinedSectionTotal)}</td></tr>
        </tbody>
      </table>
    ` : (reimbAll > 0 && combinedReimbTotal > 0 ? `<p style="font-size:9px;color:#94a3b8;font-style:italic">Todos os reembolsos pendentes deste relatório foram combinados aos pagamentos fixos acima.</p>` : '')}

    <div class="footer">Projeto Resgate · Relatório gerado automaticamente</div>
    <div class="no-print">
      <button class="primary" onclick="window.print()">🖨️ Imprimir / Salvar como PDF</button>
      <button onclick="window.close()">Fechar</button>
    </div>
  </body></html>`;
}

function generateAnnualReportHTML(){
  const year = state.currentMonth.split('-')[0];
  const months = [];
  for (let i=1; i<=12; i++) months.push(monthKey(Number(year), i));
  const rows = months.map(k => ({ key:k, ...getTotals(k) }));
  const totals = rows.reduce((acc, r) => ({
    fixed: acc.fixed + r.fixed, variable: acc.variable + r.variable,
    reimbursement: acc.reimbursement + r.reimbursement, total: acc.total + r.total, pending: acc.pending + r.pending
  }), { fixed:0, variable:0, reimbursement:0, total:0, pending:0 });

  const byBenef = {};
  for (const m of months){
    const mm = state.months[m];
    if (!mm) continue;
    for (const t of mm.transactions){
      const b = t.beneficiary || '— sem beneficiário —';
      if (!byBenef[b]) byBenef[b] = { total:0, count:0, pending:0 };
      byBenef[b].total += Number(t.amount||0);
      byBenef[b].count++;
      if (t.status === 'pending') byBenef[b].pending += Number(t.amount||0);
    }
  }
  const benefRows = Object.entries(byBenef).sort((a,b) => b[1].total - a[1].total);

  const pendingReimb = [];
  for (const m of months){
    const mm = state.months[m];
    if (!mm) continue;
    for (const t of mm.transactions){
      if (t.type === 'reimbursement' && t.status === 'pending'){
        pendingReimb.push({ ...t, monthKey: m });
      }
    }
  }
  pendingReimb.sort((a,b) => (a.date||'').localeCompare(b.date||''));

  return `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Relatório Anual — ${year}</title>
  <style>
    @page { margin: 1.2cm; }
    * { box-sizing: border-box; }
    body { font-family: Arial, Helvetica, sans-serif; font-size: 10px; color: #1e293b; margin: 0; padding: 0; }
    h1 { font-size: 18px; margin: 0 0 4px; color: #1e40af; }
    h2 { font-size: 12px; margin: 16px 0 6px; padding-bottom: 4px; border-bottom: 2px solid #2563eb; color: #1e40af; text-transform: uppercase; letter-spacing: .5px; }
    .header { border-bottom: 3px solid #2563eb; padding-bottom: 10px; margin-bottom: 14px; }
    .subtitle { color: #64748b; font-size: 10px; margin-top: 2px; }
    .meta { display: flex; justify-content: space-between; font-size: 9px; color: #64748b; margin-top: 6px; }
    .summary { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 14px; }
    .summary-card { border: 1px solid #e2e8f0; padding: 8px; border-radius: 4px; }
    .summary-card .label { font-size: 8px; text-transform: uppercase; color: #64748b; font-weight: bold; letter-spacing: .3px; }
    .summary-card .value { font-size: 13px; font-weight: bold; margin-top: 3px; color: #1e293b; }
    .summary-card.fixed .value { color: #1e40af; }
    .summary-card.variable .value { color: #6d28d9; }
    .summary-card.reimb .value { color: #b45309; }
    .summary-card.pending .value { color: #b91c1c; }
    .note { font-size: 9px; color: #64748b; font-style: italic; margin-bottom: 12px; padding: 6px 8px; background: #f8fafc; border-left: 3px solid #2563eb; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
    th, td { border: 1px solid #cbd5e1; padding: 4px 6px; text-align: left; font-size: 9px; }
    th { background: #f1f5f9; font-weight: bold; color: #475569; text-transform: uppercase; font-size: 8px; letter-spacing: .3px; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .total-row { background: #f8fafc; font-weight: bold; }
    .footer { margin-top: 20px; padding-top: 8px; border-top: 1px solid #cbd5e1; font-size: 8px; color: #94a3b8; text-align: center; }
    .no-print { text-align: center; margin-top: 20px; padding: 10px; }
    .no-print button { padding: 8px 16px; margin: 0 6px; font-size: 12px; cursor: pointer; border-radius: 5px; border: 1px solid #cbd5e1; background: #fff; font-family: inherit; }
    .no-print button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
    @media print { .no-print { display: none; } body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
  </style></head><body>
    <div class="header">
      <h1>Projeto Resgate — Relatório Anual ${year}</h1>
      <div class="subtitle">Consolidado de janeiro a dezembro</div>
      <div class="meta"><span>Gerado em ${new Date().toLocaleString('pt-BR')}</span><span>${rows.reduce((s,r) => s + (state.months[r.key]?.transactions.length||0), 0)} lançamentos no ano</span></div>
    </div>
    <div class="summary">
      <div class="summary-card fixed"><div class="label">Fixas</div><div class="value">${fmtBRL(totals.fixed)}</div></div>
      <div class="summary-card variable"><div class="label">Variáveis</div><div class="value">${fmtBRL(totals.variable)}</div></div>
      <div class="summary-card reimb"><div class="label">Reembolsos</div><div class="value">${fmtBRL(totals.reimbursement)}</div></div>
      <div class="summary-card"><div class="label">Total do Ano</div><div class="value">${fmtBRL(totals.total)}</div></div>
      <div class="summary-card pending"><div class="label">Pendente</div><div class="value">${fmtBRL(totals.pending)}</div></div>
    </div>

    <h2>Comparativo mensal</h2>
    <table>
      <thead><tr><th>Mês</th><th class="num">Fixas</th><th class="num">Variáveis</th><th class="num">Reembolsos</th><th class="num">Total</th><th class="num">Pendente</th></tr></thead>
      <tbody>
        ${rows.map(r => `
          <tr>
            <td>${monthLabel(r.key)}</td>
            <td class="num">${fmtBRL(r.fixed)}</td>
            <td class="num">${fmtBRL(r.variable)}</td>
            <td class="num">${fmtBRL(r.reimbursement)}</td>
            <td class="num"><strong>${fmtBRL(r.total)}</strong></td>
            <td class="num">${fmtBRL(r.pending)}</td>
          </tr>
        `).join('')}
        <tr class="total-row"><td>Total do ano</td><td class="num">${fmtBRL(totals.fixed)}</td><td class="num">${fmtBRL(totals.variable)}</td><td class="num">${fmtBRL(totals.reimbursement)}</td><td class="num">${fmtBRL(totals.total)}</td><td class="num">${fmtBRL(totals.pending)}</td></tr>
      </tbody>
    </table>

    <h2>Consolidado por beneficiário</h2>
    <table>
      <thead><tr><th>Beneficiário</th><th class="num">Lançamentos</th><th class="num">Total (inclui reembolsos)</th><th class="num">Pendente</th></tr></thead>
      <tbody>
        ${benefRows.map(([name, b]) => `<tr><td>${esc(name)}</td><td class="num">${b.count}</td><td class="num">${fmtBRL(b.total)}</td><td class="num">${fmtBRL(b.pending)}</td></tr>`).join('')}
      </tbody>
    </table>

    ${pendingReimb.length > 0 ? `
      <h2>Reembolsos a devolver no ano (detalhamento)</h2>
      <div class="note">Os valores de reembolso abaixo já estão incluídos no Total de cada beneficiário na tabela anterior. Esta seção é apenas um detalhamento.</div>
      <table>
        <thead><tr><th>Mês</th><th>Data</th><th>Beneficiário</th><th>Motivo</th><th class="num">Valor</th></tr></thead>
        <tbody>
          ${pendingReimb.map(t => `<tr><td>${monthLabelShort(t.monthKey)}</td><td>${fmtDateFull(t.date)}</td><td>${esc(t.beneficiary)||'—'}</td><td>${esc(t.description)}</td><td class="num">${fmtBRL(t.amount)}</td></tr>`).join('')}
          <tr class="total-row"><td colspan="4">Total a devolver no ano</td><td class="num">${fmtBRL(pendingReimb.reduce((s,t)=>s+Number(t.amount||0),0))}</td></tr>
        </tbody>
      </table>
    ` : ''}

    <div class="footer">Projeto Resgate · Relatório anual gerado automaticamente</div>
    <div class="no-print">
      <button class="primary" onclick="window.print()">🖨️ Imprimir / Salvar como PDF</button>
      <button onclick="window.close()">Fechar</button>
    </div>
  </body></html>`;
}

function printMonthlyReport(){
  const w = window.open('', '_blank');
  if (!w){ toast('Permita popups para gerar o PDF', 'error'); return; }
  
  const hasFilters = filterState.type.length > 0 || filterState.category.length > 0 || filterState.status || filterState.beneficiary.length > 0 || filterState.search || filterState.dateFrom || filterState.dateTo;
  let filteredTx = null;
  
  if (hasFilters) {
    filteredTx = getFilteredTransactions(state.currentMonth);
  }
  
  w.document.write(generateMonthlyReportHTML(state.currentMonth, filteredTx));
  w.document.close();
}
function printAnnualReport(){
  const w = window.open('', '_blank');
  if (!w){ toast('Permita popups para gerar o PDF', 'error'); return; }
  w.document.write(generateAnnualReportHTML());
  w.document.close();
}

/* ============ INICIALIZAÇÃO ============ */
function init(){
  const draft = loadDraft();
  if (draft && draft.months) {
    state = draft;
    
    // --- MIGRAÇÃO E CORREÇÕES ---
    if (!state.contacts) state.contacts = getDefaultContacts();
    if (!state.services) state.services = getDefaultServices();
    for (const k in state.months) {
      if (!state.months[k].notes) state.months[k].notes = [];
      for (const tx of state.months[k].transactions) {
        if (tx.beneficiary === 'Marco (MEI)') tx.beneficiary = 'Marco Túlio';
      }
    }
    if (state.templates) {
        for (const t of state.templates) {
            if (t.beneficiary === 'Marco (MEI)') t.beneficiary = 'Marco Túlio';
        }
    }
    if (state.contacts) {
        for (const c of state.contacts) {
            if (c.name === 'Marco (MEI) / M. Túlio' || c.name === 'Marco (MEI)') c.name = 'Marco Túlio';
        }
    }
    
    if (state.templates.length === 0 && Object.keys(state.months).length > 0) {
        const tempMap = new Map();
        const mKeys = Object.keys(state.months).sort().reverse();
        for (const mk of mKeys) {
            for (const t of state.months[mk].transactions) {
                if (t.type === 'fixed' && !tempMap.has(t.description)) {
                    tempMap.set(t.description, {
                        id: uid(), description: t.description, category: t.category, defaultAmount: t.amount, beneficiary: t.beneficiary, paymentMethod: t.paymentMethod, active: true
                    });
                }
            }
        }
        state.templates = Array.from(tempMap.values());
    }
    saveDraft();
    hasUnsavedFileChanges = true;
  } else {
    state = buildSeed();
    hasUnsavedFileChanges = true;
  }
  if (!state.currentMonth) state.currentMonth = '2026-11';
  if (!state.templates) state.templates = [];
  if (!state.contacts) state.contacts = getDefaultContacts();
  if (!state.services) state.services = getDefaultServices();
  
  renderMonthSelect();
  updateFileStatus();
  getMonth(state.currentMonth);
  renderDashboard();

  // Fechar dropdowns ao clicar fora
  document.addEventListener('click', () => {
    if (openDropdown) {
      openDropdown = null;
      if (document.getElementById('view-lancamentos').classList.contains('active')) {
        renderLancamentos();
      }
    }
  });

  window.addEventListener('beforeunload', (e) => {
    if (hasUnsavedFileChanges) {
      e.preventDefault();
      e.returnValue = 'Você tem alterações não salvas no arquivo. Salve antes de sair?';
      return e.returnValue;
    }
  });
}
init();
